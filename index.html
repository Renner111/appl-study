<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#94b8ff" />
  <title>Appl Study</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Appl Study home"><span class="brand-mark">A</span><span>appl study</span></a>
    <nav class="tabs" id="tabs" aria-label="Open pages"></nav>
    <button class="icon-button" id="newTabButton" aria-label="Open a new tab" title="New tab">+</button>
  </header>
  <main id="homePage" class="home-page">
    <section class="hero">
      <h1>appl study</h1>
      <form id="searchForm" class="search-shell" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m1.35-5.15a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
        <input id="searchInput" type="search" placeholder="Search games or websites" aria-label="Search games or websites" />
        <button class="search-button" type="submit" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
      </form>
      <div id="overview" class="overview" hidden></div>
      <div class="quick-grid" aria-label="Original arcade games">
        <button class="game-card" data-name="Frostline Run" data-url="games.html?game=sled"><span class="game-icon snow">❄</span><span><strong>Frostline Run</strong><small>Chill downhill dodger</small></span></button>
        <button class="game-card" data-name="Pulse Cube" data-url="games.html?game=cube"><span class="game-icon geometry">◆</span><span><strong>Pulse Cube</strong><small>Beat-jumping challenge</small></span></button>
        <button class="game-card" data-name="Kiwi Skies" data-url="games.html?game=flight"><span class="game-icon kiwi">🥝</span><span><strong>Kiwi Skies</strong><small>Sky-high arcade flier</small></span></button>
      </div>
      <p class="home-note">Original mini-games made for Appl Study. Use the arrow keys, space bar, or on-screen controls.</p>
    </section>
  </main>
  <main id="browserPage" class="browser-page" hidden><iframe id="contentFrame" title="Website content" referrerpolicy="strict-origin-when-cross-origin"></iframe></main>
  <script src="script.js"></script>
</body>
</html>
